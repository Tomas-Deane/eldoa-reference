<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ELDOA Reference</title>
  <meta name="description" content="A visual reference for spinal and joint-specific ELDOA exercises.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header class="masthead">
      <div><p class="eyebrow">QUICK REFERENCE</p><h1>ELDOA<br>Reference.</h1></div>
      <div class="header-meta"><p>1 minute per exercise</p></div>
    </header>
    <nav class="filters" aria-label="Exercise filters"></nav>
    <div class="layout">
      <section class="sequence" aria-live="polite"></section>
      <aside class="spine-nav">
        <div class="current"><strong>C2—C3</strong></div>
        <div class="spine-figure" aria-label="Interactive lateral view of the human spine">
          <object class="spine-anatomy" data="spine-red.svg" type="image/svg+xml" aria-label="Human vertebral column, lateral view"></object>
          <div class="spine-levels"></div>
        </div>
        <p class="level-note">LEVEL 2</p>
      </aside>
    </div>
    <section class="extended" id="levels-3-6">
      <div class="extended-heading"><div><p class="eyebrow">LEVELS 3—6</p><h3>Joint-specific<br>ELDOA.</h3></div></div>
      <div class="reference-levels"></div>
    </section>
  </main>
  <script>
    const N=id=>`https://nwfeldoaonlinemembers.vhx.tv/nwf-eldoa-exercises/videos/${id}`;
    const poses = [
      ['c2-c3','C2','C3','cervical',N('c2-c3')],['c3-c4','C3','C4','cervical',N('c3-c4')],['c4-c5','C4','C5','cervical',N('c4-c5'),1],
      ['c5-c6','C5','C6','cervical',N('c5-c6')],['c6-c7','C6','C7','cervical',N('c6-c7')],['c7-t1','C7','T1','cervical',N('c7-t1'),1],
      ['t1-t2','T1','T2','thoracic',N('t1-t2'),1],['t2-t3','T2','T3','thoracic',N('t2-t3')],['t3-t4','T3','T4','thoracic',N('t3-t4')],
      ['t4-t5','T4','T5','thoracic',N('t4-t5'),1],['t5-t6','T5','T6','thoracic',N('t5-t6')],['t6-t7','T6','T7','thoracic',N('t6-t7'),1],
      ['t7-t8','T7','T8','thoracic',N('t7-t8')],['t8-t9','T8','T9','thoracic',N('t8-t9'),1],['t9-t10','T9','T10','thoracic',N('t9-t10')],
      ['t10-t11','T10','T11','thoracic',N('t10-t11')],['t11-t12','T11','T12','thoracic',N('t11-t12')],['t12-l1','T12','L1','thoracic',N('t12-l1'),1],
      ['l1-l2','L1','L2','lumbar',N('l1-l2')],['l2-l3','L2','L3','lumbar',N('l2-l3')],['l3-l4','L3','L4','lumbar',N('l3-l4'),1],
      ['l4-l5','L4','L5','lumbar',N('l4-l5'),1],['l5-s1','L5','S1','lumbar',N('l5-s1'),1]
    ];
    const vertebraParts={
      // Posterior elements are separate SVG paths; path120 is a composite shared by T3 and T4.
      C2:['path52','path104'],C3:['path54','path106'],C4:['path56','path108'],C5:['path58','path110'],C6:['path60','path112'],C7:['path62','path114'],
      T1:['path64','path116'],T2:['path66','path118'],T3:['path68','path120'],T4:['path70','path120'],T5:['path72','path122'],T6:['path74','path124'],
      T7:['path76','path126'],T8:['path78','path128'],T9:['path80','path130'],T10:['path82','path132'],T11:['path84','path134'],T12:['path86','path136'],
      L1:['path88','path138'],L2:['path90','path140'],L3:['path92','path142'],L4:['path94','path144'],L5:['path96','path146'],S1:['path98','path148']
    };
    const spineMap={
      'c2-c3':[11.06,'C2','rect48','C3'],'c3-c4':[13.41,'C3','rect46','C4'],'c4-c5':[15.74,'C4','rect44','C5'],'c5-c6':[17.89,'C5','path42','C6'],
      'c6-c7':[20.38,'C6','path40','C7'],'c7-t1':[22.34,'C7','path38','T1'],'t1-t2':[24.76,'T1','path26','T2'],'t2-t3':[27.25,'T2','path36','T3'],
      't3-t4':[29.97,'T3','path34','T4'],'t4-t5':[32.77,'T4','path32','T5'],'t5-t6':[35.84,'T5','path30','T6'],'t6-t7':[39.46,'T6','path28','T7'],
      't7-t8':[42.95,'T7','rect24','T8'],'t8-t9':[46.35,'T8','rect22','T9'],'t9-t10':[49.97,'T9','rect20','T10'],'t10-t11':[53.21,'T10','rect18','T11'],
      't11-t12':[56.39,'T11','rect16','T12'],'t12-l1':[59.83,'T12','rect14','L1'],'l1-l2':[63.43,'L1','rect12','L2'],'l2-l3':[67.46,'L2','rect10','L3'],
      'l3-l4':[71.67,'L3','rect8','L4'],'l4-l5':[76.08,'L4','rect6','L5'],'l5-s1':[79.87,'L5','rect4','S1']
    };
    const cueSheet=(setup,hold)=>`<div class="cue-sheet"><section><h3>Setup</h3><ol>${setup.map(c=>`<li>${c}</li>`).join('')}</ol></section><section><h3>Hold</h3><ul>${hold.map(c=>`<li>${c}</li>`).join('')}</ul></section></div>`;
    const guidance={
      'c2-c3':cueSheet(
        ['Exhale: press the belly button down, reach the tailbone away, tuck the chin and lengthen the neck.','Bring both legs to tabletop, with the ankles slightly higher than the knees.','Grip the inside of the knees or shins. Use the hands to lift the head as high as possible.','Keep the chin tucked and slowly roll the neck toward the floor.'],
        ['Reach the bone beneath the skull toward the wall behind you; keep the chin close to the chest.','Arms outside the hips, palms reaching past the hips. Pull the fingers and toes back.','Press the palms down, spread the fingers and reach the hands away. Push the back of the head toward the wall.']),
      'c3-c4':cueSheet(
        ['Take a deep breath. Press the belly button down into the ground.','As you breathe out, stabilize the pelvis and push the tailbone away from the head.','Pull the chin down to the ground; lengthen the back of the neck away and off the shoulders.','Bring both legs to tabletop, feet slightly higher than the knees. Knees shoulder-width—or two fists—apart.','Pull the pinky toes back toward the shins.'],
        ['Hips push away; head pushes off the shoulders.','Externally rotate the arms. Fingers point toward the feet; shoulder blades lift off the ground.','Hands beside the knees, reaching toward the heels. Palms reach toward the feet; wrists pull back.','Eyes look down between the knees. Spread the fingers so the palms get tight.','Keep the belly button down, toes toward the shins and tailbone pushing away from the head.']),
      'c4-c5':cueSheet(
        ['Take a deep breath. As you exhale, push the belly button down into the ground and stabilize the pelvis.','Push the tailbone away from the head. Pull the chin down toward the ground and lengthen the back of the neck.','Bring both legs to tabletop, feet slightly higher than the knees. Keep about two fists’ width between the knees.','Pull both pinky toes back toward the shins. Get long through the spine.'],
        ['Bring both arms toward the ceiling. Externally rotate: elbow creases point toward the head; fingers point toward the feet.','Reach the hands to the ceiling. Shoulder blades come off the ground while the spine stays flat.','Keep the hands directly over the shoulders. Head reaches off the shoulders; tailbone pushes away from the head.','Pull the pinky toes back harder and spread the fingers as hard as you can.','Eyes look down between the knees. Reach the hands away.']),
      'c5-c6':cueSheet(
        ['Lengthen the crown of the head first. Eyes look down and stay open.','Tuck the tail back, maintain the lumbar spine down and stabilize the pelvis.','Bring both legs to tabletop, feet a little above the knees. Pull the pinky toes back.','Keep the eyes down and the back of the neck long. Bring the arms over the chest into external rotation.','Push the arms up to create tension.'],
        ['Take the arms overhead about 45 degrees. Reach the palms off the shoulders and away from the body.','Push the crown of the head away. Palms go away at an angle; tail stays tucked; butt pushes away from the palms.','Keep pushing the palms off the shoulders. Back of the neck stays long; toes come back toward the knees.','Keep reaching and pushing. Eyes stay down and the jaw stays relaxed.','Breathe in; breathe out.']),
      'c6-c7':cueSheet(
        ['Tuck the pelvis back and maintain that fixed position: sacrum, belly button and lumbar spine flat against the floor.','Eyeballs stay down; back of the neck stays long. Lengthen through the crown of the head.','Bring both legs to tabletop, toes just above the knees. Pinky toes come back into eversion.','Bring the arms alongside the body into external rotation. Elbow creases face up; wrists extend.'],
        ['Push the palms alongside the body, away from the head. Lengthen the head off the shoulders.','Create tension between the palms and the head.','Pull the toes back. Push the butt away from the head and the head away from the bottom.','Palms push down and away; shoulders maintain the tension.','Keep a soft jaw, eyes down and tail tucked. Breathe and maintain the long spine.'])
    };
    const filters=['All 23','Common 10','Cervical','Thoracic','Lumbar']; let filter='All 23', observer, currentSpineId='c2-c3';
    const extra=[
      [3,'Hip','Hip joint · internal rotation','https://www.youtube.com/watch?v=Oi2EEDXa0Dg','Visual explanation'],
      [3,'Hip','Hip joint · external rotation','https://www.youtube.com/watch?v=nW2qieeS2aI','Position demonstration'],
      [3,'Hip','Hip joint · general','https://www.youtube.com/watch?v=qAnc5YfvYKc','Position demonstration'],
      [3,'Shoulder','Shoulder girdle · multi-joint','https://www.youtube.com/watch?v=QzkBCacMqv0','Full class'],
      [3,'Shoulder','Scapular ELDOA','https://www.youtube.com/shorts/KmUzBqkMUpU','Short demonstration'],
      [3,'Rib','Rib 6','https://www.youtube.com/watch?v=TY1ib5tCkww','Position demonstration'],
      [3,'Rib','Rib 8','https://www.youtube.com/watch?v=2XywEIqyEJc','Position demonstration'],
      [3,'Rib','Rib 10','https://www.youtube.com/watch?v=9T-EDHVzFdM','Position demonstration'],
      [4,'Pelvis','General SI joint','https://www.youtube.com/watch?v=GJXN4voK8oQ','Position demonstration'],
      [4,'Pelvis','SI joint normalization','https://www.youtube.com/watch?v=mK4j4K0b8kM','Full class'],
      [4,'Pelvis','Sacroiliac sequence','https://www.youtube.com/watch?v=OMS-d1ZOdSQ','Sequence demonstration'],
      [4,'Pelvis','Pubic symphysis'],
      [5,'Upper cervical','C0—C1—C2','https://www.youtube.com/watch?v=3fBe9Q8Y3Ek','Visual explanation'],
      [5,'Upper cervical','C1—C2','https://www.youtube.com/watch?v=mpPJDI4hddA','Position demonstration'],
      [5,'TMJ','Temporomandibular joint','https://www.youtube.com/watch?v=OAJ5Xc7LdH8','Assessment + ELDOA'],
      [6,'Cranial bones','Cranial-bone ELDOA positions']
    ];
    const referenceLevels=[
      [3,'Peripheral joints','Hip · shoulder · ribs and sternum'],
      [4,'Pelvis','Sacroiliac joint · pubic symphysis · sacrum'],
      [5,'Upper cervical & TMJ','Lumbar pathologies · upper cervical spine · TMJ'],
      [6,'Cranial bones','Cranial-bone ELDOA']
    ];
    const list=()=>poses.filter(p=>filter==='Common 10'?p[5]:['Cervical','Thoracic','Lumbar'].includes(filter)?p[3]===filter.toLowerCase():true);
    function updateSpine(id){
      currentSpineId=id;
      const doc=document.querySelector('.spine-anatomy').contentDocument;if(!doc)return;
      doc.querySelectorAll('[data-spine-active]').forEach(part=>{part.style.fill='#8f817d';part.style.filter='';part.removeAttribute('data-spine-active')});
      const articulation=spineMap[id];
      new Set([...vertebraParts[articulation[1]],...vertebraParts[articulation[3]]]).forEach(partId=>{const part=doc.getElementById(partId);if(!part)return;part.setAttribute('data-spine-active','true');part.style.fill='#d93624';part.style.filter='drop-shadow(0 0 5px rgba(217,54,36,.38))';part.style.transition='fill .2s ease, filter .2s ease'});
      const disc=doc.getElementById(articulation[2]);if(disc){disc.setAttribute('data-spine-active','true');disc.style.fill='#ff6542';disc.style.filter='drop-shadow(0 0 8px rgba(255,72,42,.62))';disc.style.transition='fill .2s ease, filter .2s ease'}
    }
    function render(){
      const shown=list();
      document.querySelector('.filters').innerHTML=filters.map(f=>`<button class="${f===filter?'selected':''}" data-filter="${f}">${f}</button>`).join('');
      document.querySelector('.sequence').innerHTML=shown.map((p,i)=>`<article class="pose" id="${p[0]}">
        <div class="pose-heading"><span class="count">${String(i+1).padStart(2,'0')} / ${String(shown.length).padStart(2,'0')}</span><div><p class="region">${p[3]}</p><h2>${p[1]}<span>—</span>${p[2]}</h2></div><span class="minute">1:00</span></div>
        <div class="position-frame ${guidance[p[0]]?'source-frame':''}"><img ${guidance[p[0]]?'class="original"':''} src="poses/${p[0]}.${guidance[p[0]]?'png':'avif'}" alt="Final position reference for ${p[1]}–${p[2]} ELDOA"><div class="target-tag"><i></i> TARGET&nbsp; ${p[1]}—${p[2]}</div></div>
        ${guidance[p[0]]??''}
        <div class="pose-footer"><p>Final position reference</p><a href="${p[4]}" target="_blank" rel="noreferrer">NWF exercise video ↗</a></div>
      </article>`).join('');
      document.querySelector('.spine-levels').innerHTML=shown.map(p=>`<button class="spine-level" style="top:${spineMap[p[0]][0]}%" data-jump="${p[0]}" aria-label="Jump to ${p[1]}–${p[2]}"><span class="spine-tick"></span><span class="pair">${p[1]}—${p[2]}</span></button>`).join('');
      document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render();scrollTo({top:document.querySelector('.filters').offsetTop,behavior:'smooth'})});
      document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.jump).scrollIntoView({behavior:'smooth',block:'center'}));
      observer?.disconnect(); observer=new IntersectionObserver(entries=>{const e=entries.filter(x=>x.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(!e)return;document.querySelectorAll('.spine-level').forEach(b=>b.classList.toggle('active',b.dataset.jump===e.target.id));const p=poses.find(x=>x[0]===e.target.id);document.querySelector('.current strong').textContent=p[1]+'—'+p[2];updateSpine(p[0])},{rootMargin:'-25% 0px -55% 0px',threshold:[.05,.35,.7]});
      shown.forEach(p=>observer.observe(document.getElementById(p[0])));
      const first=shown[0];document.querySelector(`[data-jump="${first[0]}"]`)?.classList.add('active');updateSpine(first[0]);
    }
    document.querySelector('.reference-levels').innerHTML=referenceLevels.map(level=>{
      const items=extra.filter(x=>x[0]===level[0]);
      return `<section class="level-section"><header class="level-heading"><p>LEVEL ${level[0]}</p><div><h4>${level[1]}</h4><span>${level[2]}</span></div></header><div class="reference-grid">${items.map((x,i)=>`<article class="reference-card ${x[1]==='TMJ'?'featured':''}"><div class="reference-blank"><span>${x[3]?'SCREENSHOT NEEDED':'REFERENCE NEEDED'}</span><b>${String(i+1).padStart(2,'0')}</b></div><div class="reference-meta"><p>${x[1]}</p><h4>${x[2]}</h4><div><span>${x[4]||'REFERENCE NEEDED'}</span>${x[3]?`<a href="${x[3]}" target="_blank" rel="noreferrer">Open video ↗</a>`:''}</div></div></article>`).join('')}</div></section>`;
    }).join('');
    function animateAtlas(now){
      const doc=document.querySelector('.spine-anatomy').contentDocument;
      const reflection=(Math.sin(now/8000*Math.PI*2)+1)/2;
      const sparkle=(Math.sin(now/9000*Math.PI*2)+1)/2;
      doc?.getElementById('atlasGold')?.setAttribute('gradientTransform',`translate(${-52+reflection*104} 0)`);
      doc?.getElementById('atlasLight')?.setAttribute('azimuth',String(195+sparkle*150));
      requestAnimationFrame(animateAtlas);
    }
    document.querySelector('.spine-anatomy').addEventListener('load',()=>updateSpine(currentSpineId));
    requestAnimationFrame(animateAtlas);
    render();
  </script>
</body>
</html>

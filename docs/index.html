<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ELDOA — Spinal Index</title>
  <meta name="description" content="A fast visual reference for the spinal ELDOA sequence from C2/C3 to L5/S1.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header class="masthead">
      <div><p class="eyebrow">ELDOA / SPINAL INDEX</p><h1>One minute.<br>One articulation.</h1></div>
      <div class="header-meta"><p><b>23</b> spinal levels</p><p><b>22</b> position references</p><p><b>01:00</b> each</p></div>
    </header>
    <nav class="filters" aria-label="Exercise filters"></nav>
    <div class="layout">
      <section class="sequence" aria-live="polite"></section>
      <aside class="spine-nav">
        <div class="current"><span>NOW</span><strong>C2—C3</strong></div>
        <div class="column-labels"><span>VERTEBRA</span><span>DISC</span></div>
        <div class="vertebrae"></div>
        <p class="level-note">LEVEL 2<br><span>Spine · L5/S1 to C2/C3</span></p>
      </aside>
    </div>
  </main>
  <script>
    const C='https://www.youtube.com/watch?v=nmULdffJCqs', T='https://www.youtube.com/watch?v=6WU4pFxIch8', L='https://www.youtube.com/watch?v=7WHaHBDDi-g';
    const poses = [
      ['c2-c3','C2','C3','cervical',C],['c3-c4','C3','C4','cervical',C],['c4-c5','C4','C5','cervical',C,1],
      ['c5-c6','C5','C6','cervical',C],['c6-c7','C6','C7','cervical',C],['c7-t1','C7','T1','cervical',C,1],
      ['t1-t2','T1','T2','thoracic',T,1],['t2-t3','T2','T3','thoracic',T],['t3-t4','T3','T4','thoracic',T],
      ['t4-t5','T4','T5','thoracic',T,1],['t5-t6','T5','T6','thoracic',T],['t6-t7','T6','T7','thoracic','https://www.youtube.com/shorts/Te1jCDxOU48',1],
      ['t7-t8','T7','T8','thoracic',T],['t8-t9','T8','T9','thoracic','https://www.youtube.com/shorts/GJBTL9XExlw',1],['t9-t10','T9','T10','thoracic',T],
      ['t10-t11','T10','T11','thoracic',T],['t11-t12','T11','T12','thoracic',T],['t12-l1','T12','L1','thoracic',T,1],
      ['l1-l2','L1','L2','lumbar',L],['l2-l3','L2','L3','lumbar',L],['l3-l4','L3','L4','lumbar',L,1],
      ['l4-l5','L4','L5','lumbar','https://www.youtube.com/shorts/8RVdXDPibEM',1],['l5-s1','L5','S1','lumbar','https://www.youtube.com/shorts/_llRn7zImh8',1]
    ];
    const filters=['All 23','Common 10','Cervical','Thoracic','Lumbar']; let filter='All 23', observer;
    const list=()=>poses.filter(p=>filter==='Common 10'?p[5]:['Cervical','Thoracic','Lumbar'].includes(filter)?p[3]===filter.toLowerCase():true);
    function render(){
      const shown=list();
      document.querySelector('.filters').innerHTML=filters.map(f=>`<button class="${f===filter?'selected':''}" data-filter="${f}">${f}</button>`).join('');
      document.querySelector('.sequence').innerHTML=shown.map((p,i)=>`<article class="pose" id="${p[0]}">
        <div class="pose-heading"><span class="count">${String(i+1).padStart(2,'0')} / ${String(shown.length).padStart(2,'0')}</span><div><p class="region">${p[3]}</p><h2>${p[1]}<span>—</span>${p[2]}</h2></div><span class="minute">1:00</span></div>
        <div class="position-frame ${p[0]==='c5-c6'?'missing':''}">${p[0]==='c5-c6'?`<div class="missing-copy"><span>REFERENCE NEEDED</span><strong>C5—C6</strong><p>No still was present in the otherwise complete source set.</p></div>`:`<img src="poses/${p[0]}.avif" alt="Final position reference for ${p[1]}–${p[2]} ELDOA">`}<div class="target-tag"><i></i> TARGET&nbsp; ${p[1]}—${p[2]}</div></div>
        <div class="pose-footer"><p>Final position reference</p><a href="${p[4]}" target="_blank" rel="noreferrer">YouTube technique ↗</a></div>
      </article>`).join('');
      document.querySelector('.vertebrae').innerHTML=shown.map(p=>`<button data-jump="${p[0]}" aria-label="Jump to ${p[1]}–${p[2]}"><span class="bone">${p[1]}</span><span class="disc"></span><span class="pair">${p[1]}—${p[2]}</span></button>`).join('')+`<div class="last-bone">${shown.at(-1)[2]}</div>`;
      document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render();scrollTo({top:document.querySelector('.filters').offsetTop,behavior:'smooth'})});
      document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.jump).scrollIntoView({behavior:'smooth',block:'center'}));
      observer?.disconnect(); observer=new IntersectionObserver(entries=>{const e=entries.filter(x=>x.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(!e)return;document.querySelectorAll('.vertebrae button').forEach(b=>b.classList.toggle('active',b.dataset.jump===e.target.id));const p=poses.find(x=>x[0]===e.target.id);document.querySelector('.current strong').textContent=p[1]+'—'+p[2]},{rootMargin:'-25% 0px -55% 0px',threshold:[.05,.35,.7]});
      shown.forEach(p=>observer.observe(document.getElementById(p[0])));
    }
    render();
  </script>
</body>
</html>
